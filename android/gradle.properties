# Right-sized for low-RAM machines (dev laptop: i3, 7 GB). The previous
# -Xmx8G/-XX:MaxMetaspaceSize=4G requested ~12 GB of address space and caused
# Gradle daemon JVM OOM crashes ("mmap failed ... G1 virtual space").
org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
android.useAndroidX=true
android.enableJetifier=true
