name: deepfake_flutter_app
description: "DeepGuard - AI-powered deepfake detection mobile application"
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  video_player: ^2.9.2
  path_provider: ^2.1.5
  provider: ^6.1.2
  file_picker: ^8.1.7
  mime: ^2.0.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  tflite_flutter: ^0.12.1
  image: ^4.2.0
  connectivity_plus: ^6.0.5
  video_thumbnail: ^0.5.6
  url_launcher: ^6.3.2
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/deepguard_logo.png
    - assets/images/provenance/
    - deepfake_icon.png
    - assets/models/deepguard_image.tflite
    - assets/models/deepguard_video.tflite
    - assets/models/labels.txt
    - assets/models/model_metadata.txt
